# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - bus-managent-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_9F11277FFA044BE6B35340AD88285EFF }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_7253DEF9CEC8496BB1C9A47D04F75BFC }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E43A5B0B37DE45B998C8347CE450154D }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Validate Azure auth secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "Missing Azure client id secret. Set either AZURE_CLIENT_ID or AZUREAPPSERVICE_CLIENTID_9F11277FFA044BE6B35340AD88285EFF"
            missing=1
          fi
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "Missing Azure tenant id secret. Set either AZURE_TENANT_ID or AZUREAPPSERVICE_TENANTID_7253DEF9CEC8496BB1C9A47D04F75BFC"
            missing=1
          fi
          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "Missing Azure subscription id secret. Set either AZURE_SUBSCRIPTION_ID or AZUREAPPSERVICE_SUBSCRIPTIONID_E43A5B0B37DE45B998C8347CE450154D"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bus-managent-frontend'
          slot-name: 'Production'
          package: dist
          