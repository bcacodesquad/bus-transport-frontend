name: Build and deploy Node.js app to Azure Web App - bus-transport-mugesh-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: bus-transport-mugesh-frontend
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build React app
        env:
          REACT_APP_API_URL: https://bus-management-backend-fmbhcqbjetejbmbx.southeastasia-01.azurewebsites.net
        run: npm run build
        working-directory: frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: react-build

      - name: Login to Azure (OIDC)
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4194532722E94BDAB72D04B4E425CA29 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B5328834B2504C2787C74C081E24EF22 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F76C8F9E88E2467D89940980DC136EB7 }}

      - name: Deploy with publish profile
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: react-build

      - name: Deploy with OIDC
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: react-build
