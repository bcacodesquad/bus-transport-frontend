name: Build and deploy frontend to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: bus-transport-mugesh-frontend
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      app_dir: ${{ steps.detect.outputs.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect app directory
        id: detect
        shell: bash
        run: |
          if [ -f "package.json" ] && [ -f "package-lock.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "frontend/package.json" ] && [ -f "frontend/package-lock.json" ]; then
            echo "dir=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "package.json + package-lock.json not found in root or frontend"
            ls -la
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: Build
        working-directory: ${{ steps.detect.outputs.dir }}
        env:
          REACT_APP_API_URL: https://bus-management-backend-fmbhcqbjetejbmbx.southeastasia-01.azurewebsites.net
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: ${{ steps.detect.outputs.dir }}/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: react-build

      - name: Create zip package
        shell: bash
        run: |
          cd react-build
          zip -r ../site.zip .

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4194532722E94BDAB72D04B4E425CA29 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B5328834B2504C2787C74C081E24EF22 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F76C8F9E88E2467D89940980DC136EB7 }}

      - name: Resolve resource group
        id: rg
        shell: bash
        run: |
          RG_NAME=$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG_NAME" ]; then
            echo "Could not resolve resource group for ${APP_NAME}"
            exit 1
          fi
          echo "name=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved RG: $RG_NAME"

      - name: Disable Oryx build
        run: |
          az webapp config appsettings set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ steps.rg.outputs.name }}" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

      - name: Remove WEBSITE_RUN_FROM_PACKAGE (if exists)
        shell: bash
        run: |
          az webapp config appsettings delete \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ steps.rg.outputs.name }}" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE || true

      - name: Deploy zip (config-zip)
        run: |
          az webapp deployment source config-zip \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ steps.rg.outputs.name }}" \
            --src site.zip

      - name: Set startup command for SPA
        run: |
          az webapp config set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ steps.rg.outputs.name }}" \
            --startup-file "pm2 serve /home/site/wwwroot --no-daemon --spa"

      - name: Restart web app
        run: |
          az webapp restart \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ steps.rg.outputs.name }}"
