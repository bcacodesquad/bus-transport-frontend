name: Build and deploy Node.js app to Azure Web App - bus-transport-mugesh-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: bus-transport-mugesh-frontend
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect app directory
        id: appdir
        shell: bash
        run: |
          if [ -f "package.json" ] && [ -f "package-lock.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "frontend/package.json" ] && [ -f "frontend/package-lock.json" ]; then
            echo "dir=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find package.json + package-lock.json in root or frontend."
            ls -la
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --no-fund
        working-directory: ${{ steps.appdir.outputs.dir }}

      - name: Build React app
        env:
          REACT_APP_API_URL: https://bus-management-backend-fmbhcqbjetejbmbx.southeastasia-01.azurewebsites.net
        run: npm run build
        working-directory: ${{ steps.appdir.outputs.dir }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: ${{ steps.appdir.outputs.dir }}/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: react-build

      - name: Create deployment zip
        shell: bash
        run: |
          cd react-build
          zip -r ../site.zip .

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4194532722E94BDAB72D04B4E425CA29 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B5328834B2504C2787C74C081E24EF22 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F76C8F9E88E2467D89940980DC136EB7 }}

      - name: Disable Oryx build and enable run from package
        run: |
          az webapp config appsettings set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false WEBSITE_RUN_FROM_PACKAGE=1

      - name: Deploy zip package
        run: |
          az webapp deploy \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --type zip \
            --src-path site.zip

      - name: Configure startup command
        run: |
          az webapp config set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --startup-file "pm2 serve /home/site/wwwroot --no-daemon --spa"

      - name: Restart Web App
        run: |
          az webapp restart \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
