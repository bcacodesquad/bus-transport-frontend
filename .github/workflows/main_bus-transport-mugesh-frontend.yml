name: Build and deploy Node.js app to Azure Web App - bus-transport-mugesh-frontend

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: bus-transport-mugesh-frontend-b4emfjcrc8gkhqhu
  RESOURCE_GROUP: ${{ secrets.AZURE_WEBAPP_RESOURCE_GROUP }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -r build/* deploy/
          cd deploy
          zip -r ../site.zip .
          cd ..

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package
          path: site.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp-package
          path: .

      - name: Verify deployment package
        run: |
          ls -la
          unzip -l site.zip | head -n 40
          du -h site.zip

      - name: Deploy with publish profile
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site.zip

      - name: Login to Azure
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D8EB9FC10A61443B88EBCDB21ECA907A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_92449528F2214904A8AC534AC889AA8B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_27CAC2B5F1314C31988E41620539BC43 }}

      - name: Resolve Resource Group
        id: resolve-rg
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: |
          if [ -n "${RESOURCE_GROUP}" ]; then
            RG_NAME="${RESOURCE_GROUP}"
          else
            RG_NAME=$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup | [0]" -o tsv)
          fi
          if [ -z "$RG_NAME" ]; then
            echo "Unable to resolve resource group for ${APP_NAME}" >&2
            exit 1
          fi
          echo "Resolved resource group: $RG_NAME"
          echo "RG_NAME=$RG_NAME" >> $GITHUB_ENV

      - name: Deploy ZIP with az webapp deploy (fallback)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: |
          az webapp deploy \
            --name "$APP_NAME" \
            --resource-group "$RG_NAME" \
            --type zip \
            --src-path site.zip

      - name: Configure startup command
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: |
          az webapp config set \
            --name "$APP_NAME" \
            --resource-group "$RG_NAME" \
            --startup-file "pm2 serve /home/site/wwwroot --no-daemon --spa"

      - name: Restart Web App
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: |
          az webapp restart \
            --name "$APP_NAME" \
            --resource-group "$RG_NAME"

      - name: Fail when no deployment auth is configured
        if: ${{ always() && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: |
          echo "Using OIDC fallback path. If this job fails with AuthorizationFailed, grant the service principal access to the Web App or set AZURE_WEBAPP_PUBLISH_PROFILE." 
